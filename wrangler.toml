name = "goyhub"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "public"

# D1 database (bound as DB): users, sessions, forum, IP audit log, rate limits.
# The Function creates its own tables and seed data on first request, so no
# manual schema step is required once this is bound.
[[d1_databases]]
binding = "DB"
database_name = "goyhub"
database_id = "1f2fd246-9cf1-46d0-a88a-629ad12f4243"

[vars]
# Registered entity shown on the legal pages. Replace before publishing —
# until these are real, both legal pages show a "Setup required" banner.
COMPANY_LEGAL_NAME = "goyhub"
COMPANY_REG_NUMBER = "69676420"
COMPANY_ADDRESS = "1 Main RD"
COMPANY_CITY = "Mutsamudu"
COMPANY_CONTACT_EMAIL = "support@goyhub.st"
COMPANY_PRIVACY_EMAIL = "privacy@goyhub.st"
COMPANY_LEGAL_EMAIL = "legal@goyhub.st"

# Proof-of-work difficulty in leading zero bits (8–24). Each +1 doubles the
# client's work. Keep PBKDF2 modest on the free plan (10ms CPU/request).
CAPTCHA_DIFFICULTY = "16"
PBKDF2_ITERATIONS = "100000"

# Rate limits: attempts per window (10 min / hour / minute / 3 hours / minute).
RATE_LIMIT_LOGIN = "10"
RATE_LIMIT_SIGNUP = "5"
RATE_LIMIT_POST = "6"
RATE_LIMIT_DOWNLOAD = "20"  # per IP per 3h; staff/admin are exempt entirely (see routes-main.js)
RATE_LIMIT_SHOUT = "3"
RATE_LIMIT_REPORT = "5"

# Flood / mass-account protection (application layer — Cloudflare's own WAF,
# Bot Fight Mode and Under Attack mode remain the first line for real DDoS).
#   RATE_LIMIT_BURST     per-IP requests/minute across ALL dynamic routes ("0" disables)
#   RATE_LIMIT_FLOOD     burst breaches per 10 min before a temporary auto IP ban
#   AUTO_IP_BAN_MINUTES  how long an automatic flood ban lasts
#   SIGNUP_SURGE_LIMIT   site-wide signups per 10 min before registration pauses ("0" disables)
RATE_LIMIT_BURST = "240"
RATE_LIMIT_FLOOD = "5"
AUTO_IP_BAN_MINUTES = "60"
SIGNUP_SURGE_LIMIT = "30"

# Crypto payments (the /upgrade page). All optional — with none set the page
# shows an honest "payments coming soon" note with the support contact.
#
# PREFERRED: a self-hosted BTCPay Server (crypto-only, no third party). When the
# four BTCPAY_* values plus PAID_PRICE_AMOUNT are set, /upgrade shows a one-click
# "Pay with crypto" button that creates an invoice and upgrades the account
# automatically once the payment confirms on-chain (verified by a signed
# webhook). Full setup guide: BTCPAY-SETUP.md.
#   BTCPAY_URL           https base URL of your BTCPay Server, e.g. https://btcpay.goyhub.st
#   BTCPAY_STORE_ID      the store's id (Store Settings → the id in the URL / General)
#   PAID_PRICE_AMOUNT    numeric price per membership, e.g. "10.00"
#   PAID_PRICE_CURRENCY  ISO currency the invoice is priced in (default "USD")
#   STORE_PLANS          FALLBACK catalogue, used only while the admin-managed
#                        products table (Admin -> Shop) is empty. Offers several
#                        lengths without touching the panel:
#                          "id:Name:amount:days,…"   days 0 = lifetime
#                        e.g. "m1:1 Month:9.99:30,m12:12 Months:79.99:365,life:Lifetime:149.99:0"
#                        An entry that does not parse is dropped rather than sold
#                        at a wrong price. Prices are read from here at checkout,
#                        never from the buyer's form — the form only names a plan
#                        id — and each order snapshots what it was sold at, so a
#                        later price change never rewrites an in-flight purchase.
#   PAID_PERIOD_DAYS     membership length in days; empty or "0" = lifetime
# BTCPAY_URL = "https://btcpay.example.com"
# BTCPAY_STORE_ID = ""
# PAID_PRICE_AMOUNT = "10.00"
# PAID_PRICE_CURRENCY = "USD"
# STORE_PLANS = "m1:1 Month:9.99:30,m12:12 Months:79.99:365,life:Lifetime:149.99:0"
# PAID_PERIOD_DAYS = "30"
# RATE_LIMIT_CHECKOUT = "8"   # invoices a member can create per hour (abuse cap)
#
# BTCPAY_API_KEY and BTCPAY_WEBHOOK_SECRET are SECRETS — never put them here.
# Add them in the Pages dashboard (Settings → Variables and Secrets, type
# Secret) or with `npx wrangler pages secret put NAME`, exactly like
# ADMIN_PASSWORD. See the secrets note near the bottom of this file.
#
# FALLBACKS (used only when BTCPay is not configured):
#   CRYPTO_PAY_URL        hosted checkout link (Coinbase Commerce, NOWPayments…)
#   CRYPTO_PAY_ADDRESSES  manual addresses, e.g. "BTC:bc1qxy...,ETH:0xab...,LTC:ltc1..."
#   PAID_PRICE            display string that overrides the composed price, e.g. "$10 / month"
# CRYPTO_PAY_URL = ""
# CRYPTO_PAY_ADDRESSES = ""
# PAID_PRICE = ""
BTCPAY_URL = "https://btcpay.goyhub.st"
BTCPAY_STORE_ID = "D67RM4RGe9SKTdqA7Au8kz37MaFTkb5oVzHhfHoJsh4v"
# Outbound email (password reset + verification) via Cloudflare's Email
# Service SMTPS relay (smtp.mx.cloudflare.net:465, spoken natively over
# cloudflare:sockets). Alternatives: "resend" | "sendgrid" | "mailchannels".
#
# The ONE value that must NOT live in this file is EMAIL_API_KEY (the API
# token with the "Email Sending: Edit" permission) — committing a live
# credential to Git hands mail-sending to anyone who ever sees the repo.
# Add it in the Pages dashboard (Settings → Variables and Secrets, type
# Secret), exactly like ADMIN_PASSWORD and CAPTCHA_SECRET already are.
# Email stays cleanly disabled until that secret exists.
EMAIL_PROVIDER = "cloudflare"
EMAIL_FROM = "welcome@noreply.goyhub.st"
EMAIL_FROM_NAME = "GoyHub"
# EMAIL_SMTP_HOST = "smtp.mx.cloudflare.net"   # default
# EMAIL_SMTP_PORT = "465"                      # default
# With email configured, forum posting requires a verified address
# (REQUIRE_VERIFIED_EMAIL = "0" turns that gate off).
# DISPOSABLE_EMAIL_DOMAINS = ""   # extra comma-separated throwaway domains to block

# Cloudflare Turnstile (optional second signup CAPTCHA layered on the built-in
# proof-of-work). Create a site in dashboard → Turnstile, then set:
#   TURNSTILE_SITE_KEY    (plain var is fine)
#   TURNSTILE_SECRET_KEY  (secret)

# Secrets are NOT set here. Add them in the Pages dashboard (Settings →
# Variables and Secrets) or with `npx wrangler pages secret put NAME`, or in
# .dev.vars for local dev:
#   CAPTCHA_SECRET   signs CAPTCHA challenges (required)
#   ADMIN_PASSWORD   password for the seeded admin account (required) — stays
#                    in sync with this value on every boot, so rotating it
#                    here (then redeploying) always takes effect
#   ADMIN_USERNAME   optional, defaults to "admin"
#   LICENSE_SECRET   signs the /account/license token the desktop loader
#                    verifies a member's tier with. Falls back to
#                    CAPTCHA_SECRET if unset — set a dedicated one in
#                    production so rotating one doesn't invalidate the other.
#   DOWNLOAD_URL     where the installer actually lives (your own host, a CDN,
#                    a GitHub release asset, ...). REQUIRED for the download
#                    to work — there is no fallback. The route fetches it
#                    server-side and streams the bytes straight through, so
#                    the URL itself is never sent to the browser. Unset, or
#                    unreachable: /download/file serves a clean "unavailable"
#                    response instead of silently substituting a different
#                    file. Set it as a Secret, never as a plain [vars] entry
#                    above — this file is committed, and a plain var would put
#                    the "hidden" URL in plaintext in git history and the
#                    dashboard's variable list.
#   BTCPAY_API_KEY        BTCPay Greenfield API key with the
#                         btcpay.store.cancreateinvoice + canviewinvoices
#                         permissions on your store (creates checkout invoices)
#   BTCPAY_WEBHOOK_SECRET the signing secret of the store webhook that points at
#                         https://your-site/api/btcpay/webhook — every webhook is
#                         HMAC-verified against this before it can grant Paid
