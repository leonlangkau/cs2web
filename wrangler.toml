name = "goyhub"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "public"

# D1 database (bound as DB): users, sessions, forum, IP audit log, rate limits.
# The Function creates its own tables and seed data on first request, so no
# manual schema step is required once this is bound.
[[d1_databases]]
binding = "DB"
database_name = "goyhub"
database_id = "1f2fd246-9cf1-46d0-a88a-629ad12f4243"

[vars]
# Registered entity shown on the legal pages. Replace before publishing —
# until these are real, both legal pages show a "Setup required" banner.
COMPANY_LEGAL_NAME = "goyhub"
COMPANY_REG_NUMBER = "69676420"
COMPANY_ADDRESS = "1 Main RD"
COMPANY_CITY = "Mutsamudu"
COMPANY_CONTACT_EMAIL = "support@goyhub.st"
COMPANY_PRIVACY_EMAIL = "privacy@goyhub.st"
COMPANY_LEGAL_EMAIL = "legal@goyhub.st"

# Proof-of-work difficulty in leading zero bits (8–24). Each +1 doubles the
# client's work. Keep PBKDF2 modest on the free plan (10ms CPU/request).
CAPTCHA_DIFFICULTY = "16"
PBKDF2_ITERATIONS = "100000"

# Rate limits: attempts per window (10 min / hour / minute / hour / minute).
RATE_LIMIT_LOGIN = "10"
RATE_LIMIT_SIGNUP = "5"
RATE_LIMIT_POST = "6"
RATE_LIMIT_DOWNLOAD = "3"
RATE_LIMIT_SHOUT = "3"
RATE_LIMIT_REPORT = "5"

# Flood / mass-account protection (application layer — Cloudflare's own WAF,
# Bot Fight Mode and Under Attack mode remain the first line for real DDoS).
#   RATE_LIMIT_BURST     per-IP requests/minute across ALL dynamic routes ("0" disables)
#   RATE_LIMIT_FLOOD     burst breaches per 10 min before a temporary auto IP ban
#   AUTO_IP_BAN_MINUTES  how long an automatic flood ban lasts
#   SIGNUP_SURGE_LIMIT   site-wide signups per 10 min before registration pauses ("0" disables)
RATE_LIMIT_BURST = "240"
RATE_LIMIT_FLOOD = "5"
AUTO_IP_BAN_MINUTES = "60"
SIGNUP_SURGE_LIMIT = "30"

# Crypto payments (the /upgrade page). All optional — with none set the page
# shows an honest "payments coming soon" note with the support contact.
#   CRYPTO_PAY_URL        hosted checkout link (Coinbase Commerce, NOWPayments,
#                         BTCPay, …) once you set one up — shown as the pay button
#   CRYPTO_PAY_ADDRESSES  manual fallback, e.g. "BTC:bc1qxy...,ETH:0xab...,LTC:ltc1..."
#   PAID_PRICE            display string, e.g. "$10 / month"
# CRYPTO_PAY_URL = ""
# CRYPTO_PAY_ADDRESSES = ""
# PAID_PRICE = ""

# Outbound email (password reset + verification) via Cloudflare's Email
# Service SMTPS relay (smtp.mx.cloudflare.net:465, spoken natively over
# cloudflare:sockets). Alternatives: "resend" | "sendgrid" | "mailchannels".
#
# The ONE value that must NOT live in this file is EMAIL_API_KEY (the API
# token with the "Email Sending: Edit" permission) — committing a live
# credential to Git hands mail-sending to anyone who ever sees the repo.
# Add it in the Pages dashboard (Settings → Variables and Secrets, type
# Secret), exactly like ADMIN_PASSWORD and CAPTCHA_SECRET already are.
# Email stays cleanly disabled until that secret exists.
EMAIL_PROVIDER = "cloudflare"
EMAIL_FROM = "welcome@noreply.goyhub.st"
EMAIL_FROM_NAME = "GoyHub"
# EMAIL_SMTP_HOST = "smtp.mx.cloudflare.net"   # default
# EMAIL_SMTP_PORT = "465"                      # default
# With email configured, forum posting requires a verified address
# (REQUIRE_VERIFIED_EMAIL = "0" turns that gate off).
# DISPOSABLE_EMAIL_DOMAINS = ""   # extra comma-separated throwaway domains to block

# Cloudflare Turnstile (optional second signup CAPTCHA layered on the built-in
# proof-of-work). Create a site in dashboard → Turnstile, then set:
#   TURNSTILE_SITE_KEY    (plain var is fine)
#   TURNSTILE_SECRET_KEY  (secret)

# Secrets are NOT set here. Add them in the Pages dashboard (Settings →
# Variables and Secrets) or with `npx wrangler pages secret put NAME`, or in
# .dev.vars for local dev:
#   CAPTCHA_SECRET   signs CAPTCHA challenges (required)
#   ADMIN_PASSWORD   password for the seeded admin account (required) — stays
#                    in sync with this value on every boot, so rotating it
#                    here (then redeploying) always takes effect
#   ADMIN_USERNAME   optional, defaults to "admin"
#   LICENSE_SECRET   signs the /account/license token the desktop loader
#                    verifies a member's tier with. Falls back to
#                    CAPTCHA_SECRET if unset — set a dedicated one in
#                    production so rotating one doesn't invalidate the other.

# DOWNLOAD_URL: where the installer actually lives (your own host, a CDN, a
# GitHub release asset, ...). The download route fetches it server-side and
# streams the bytes straight through — the URL itself is never sent to the
# browser. Set it as a SECRET (dashboard → Settings → Variables and Secrets,
# or `npx wrangler pages secret put DOWNLOAD_URL`), never as a plain [vars]
# entry here — this file is committed, and a plain var would put the "hidden"
# URL in plaintext in git history and the dashboard's variable list.
# Unset or unreachable: falls back to the INSTALLER R2 binding below, then to
# the copy embedded in the Function bundle.

# Optional: serve a real, multi-megabyte installer from R2 instead of the copy
# embedded in the Function bundle. Create the bucket, upload the zip under its
# exact filename, then uncomment. The download route prefers R2 automatically
# when DOWNLOAD_URL is unset.
# [[r2_buckets]]
# binding = "INSTALLER"
# bucket_name = "goyhub-installer"
