# Cloudflare WORKERS configuration for GoyHub.
#
# Only needed if you deploy as a Worker rather than a Pages project:
#   npm run cf:deploy      (wrangler deploy -c wrangler.workers.toml)
#
# The repo's default wrangler.toml is the Pages config, because the Pages Git
# integration reads that filename automatically on every push. Both entry points
# mount the identical app, so the two paths behave the same.

name = "goyhub"
main = "worker/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Static Assets: everything in public/ is served straight from the edge before
# the Worker runs. The installer deliberately lives in artifacts/, outside this
# directory, so downloads always go through the audited, rate-limited route.
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "goyhub"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
COMPANY_LEGAL_NAME = "[Registered Company Name]"
COMPANY_REG_NUMBER = "[Registration Number]"
COMPANY_ADDRESS = "[Registered Office Address]"
COMPANY_CITY = "Mutsamudu"
COMPANY_CONTACT_EMAIL = "support@goyhub.com"
COMPANY_PRIVACY_EMAIL = "privacy@goyhub.com"
COMPANY_LEGAL_EMAIL = "legal@goyhub.com"
CAPTCHA_DIFFICULTY = "16"
PBKDF2_ITERATIONS = "100000"
RATE_LIMIT_LOGIN = "10"
RATE_LIMIT_SIGNUP = "5"
RATE_LIMIT_POST = "6"
RATE_LIMIT_DOWNLOAD = "30"

# Secrets — `npx wrangler secret put NAME -c wrangler.workers.toml`:
#   CAPTCHA_SECRET, ADMIN_PASSWORD, ADMIN_USERNAME

# Housekeeping: expire sessions, rate-limit windows and used CAPTCHA nonces.
[triggers]
crons = ["0 * * * *"]

# Optional: serve a real, multi-megabyte installer from R2 instead of the copy
# embedded in the bundle.
# [[r2_buckets]]
# binding = "INSTALLER"
# bucket_name = "goyhub-installer"

# [[routes]]
# pattern = "goyhub.com"
# custom_domain = true
